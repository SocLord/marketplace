<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фармоиш — Бозори Онлайн</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Бозори Онлайн</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Кушодани меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Саҳифаи асосӣ</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="products.html">Каталог</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <nav aria-label="Занҷири навигатсионӣ">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Асосӣ</a></li>
        <li class="breadcrumb-item"><a href="products.html">Каталог</a></li>
        <li class="breadcrumb-item active" aria-current="page">Фармоиш</li>
      </ol>
    </nav>

    <h1 class="mb-4">Оформить заказ</h1>

    <form id="order-form" class="card card-body" method="post" action="/orders/create" novalidate>
      <div class="mb-3">
        <label class="form-label" for="customer-name">Номи муштарӣ *</label>
        <input class="form-control" type="text" id="customer-name" name="customer_name" required maxlength="100" aria-describedby="customer-name-error">
        <div class="invalid-feedback" id="customer-name-error"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="phone">Рақами телефон *</label>
        <input class="form-control" type="tel" id="phone" name="phone" required pattern="[+][0-9\s\-()]{7,20}" placeholder="+992 92 123 45 67" aria-describedby="phone-error">
        <div class="invalid-feedback" id="phone-error"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="address">Суроға *</label>
        <textarea class="form-control" id="address" name="address" required maxlength="255" rows="3" aria-describedby="address-error"></textarea>
        <div class="invalid-feedback" id="address-error"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="product-id">Маҳсулот *</label>
        <select class="form-select" id="product-id" name="product_id" required aria-describedby="product-id-error">
          <option value="">Маҳсулотро интихоб кунед</option>
          <option value="1">Ноутбук Asus ZenBook 14 — 14 500 с.</option>
          <option value="2">Смартфон Samsung Galaxy S24 — 8 900 с.</option>
          <option value="3">Наушники Sony WH-1000XM5 — 2 500 с.</option>
        </select>
        <div class="invalid-feedback" id="product-id-error"></div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Фиристодан</button>
        <a href="products.html" class="btn btn-outline-secondary">Бозгашт</a>
      </div>
    </form>
  </main>

  <footer class="app-footer container py-4 text-center">
    <p class="mb-0">© 2026 Бозори Онлайн · Душанбе, Тоҷикистон</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
